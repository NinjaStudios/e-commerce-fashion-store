# Runs the type check and the browser tests on every pull request and on pushes to main,
# so a broken change is caught before it reaches Vercel.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter pratyangi-api run generate
      - run: pnpm api:typecheck
      - run: pnpm --filter pratyangi-web exec playwright install --with-deps chromium
      # builds the site, then runs every browser test against the build
      - run: pnpm test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api:
    # the store API (apps/api) against a real MySQL, started fresh for the run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 53627cec9cf8c0e44430afb35a5e
          MYSQL_DATABASE: pratyangi_shop_test
          MYSQL_USER: pratyangi
          MYSQL_PASSWORD: 59c49f9cd1d86ecc9884d0226a52
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p53627cec9cf8c0e44430afb35a5e"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pratyangi-api run generate
      - run: pnpm api:test
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://pratyangi:59c49f9cd1d86ecc9884d0226a52@127.0.0.1:3306/pratyangi_shop_test
          WEB_ORIGIN: http://localhost:3000
